function buildTrickMenu(){const sc=tmEl.scrollTop;tdial.innerHTML='';
[5,6,7,4,-1,0,3,2,1].forEach(i=>{if(i<0){const c=document.createElement('div');c.className='tc';c.textContent='FLICK ↔';tdial.appendChild(c);return}
const b=document.createElement('button');b.className='slot'+(i==selSlot?' sel':'');b.textContent=TRK[SLOTS[i]].lab;b.onclick=()=>{selSlot=i;buildTrickMenu()};tdial.appendChild(b)});
tlist.innerHTML='';const cats=[];TL.forEach(t=>{if(!cats.includes(t[3]))cats.push(t[3])});
cats.forEach(cat=>{const d=document.createElement('div');d.className='sec';d.innerHTML='<h3>'+cat+'</h3>';const r=document.createElement('div');r.className='rw';
TL.filter(t=>t[3]==cat).forEach(t=>{const id=t[0],b=document.createElement('button');b.className='chip'+(SLOTS[selSlot]==id?' sel':SLOTS.includes(id)?' used':'');b.textContent=t[1];
b.onclick=()=>{const j=SLOTS.indexOf(id);if(j>=0&&j!=selSlot)SLOTS[j]=SLOTS[selSlot];SLOTS[selSlot]=id;saveTricks();buildTrickMenu()};r.appendChild(b)});d.appendChild(r);tlist.appendChild(d)});
tmEl.scrollTop=sc}
function setUI(v){ui=v;document.body.classList.toggle('t',v=='title');titleEl.style.display=v=='title'?'block':'none'}
function openMenu(w){ret=ui=='title'?'title':'';setUI(w);paused=true;btn.m=btn.g=btn.p=false;menu.style.display=w=='d'?'block':'none';mm.style.display=w=='m'?'block':'none';tmEl.style.display=w=='t'?'block':'none';if(w=='d')build();else if(w=='m')buildMaps();else buildTrickMenu()}
function closeMenu(){menu.style.display=mm.style.display=tmEl.style.display='none';save();if((ui=='d'||ui=='t')&&ret=='title'){setUI('title');return}setUI('');ret='';paused=false;hint=0}
document.getElementById('ff').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const m=Math.min(im.width,im.height);
c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);CFG.face=c;CFG.faceURL=c.toDataURL('image/jpeg',.8);save();buildSkater()};im.src=fr.result};fr.readAsDataURL(f);e.target.value=''};
document.getElementById('nf').onclick=()=>{CFG.face=null;CFG.faceURL='';save();buildSkater()};
document.getElementById('play').onclick=closeMenu;document.getElementById('mapdone').onclick=closeMenu;
document.getElementById('bt').onpointerdown=e=>{e.stopPropagation();openMenu('d')};
document.getElementById('bm').onpointerdown=e=>{e.stopPropagation();openMenu('m')};
document.getElementById('tplay').onclick=()=>openMenu('m');
document.getElementById('ttricks').onclick=()=>openMenu('t');
document.getElementById('bk').onpointerdown=e=>{e.stopPropagation();openMenu('t')};
document.getElementById('tdone').onclick=closeMenu;
document.getElementById('treset').onclick=()=>{SLOTS=DEF_SLOTS.slice();saveTricks();buildTrickMenu()};
document.getElementById('tdrip').onclick=()=>openMenu('d');
try{const sv=JSON.parse(localStorage.getItem('skate3dCfg')||localStorage.getItem('skateCfg')||'null');if(sv){if(sv.v!=2){delete sv.style;delete sv.shirtC}Object.assign(CFG,sv,{face:null,v:2});if(CFG.faceURL){const im=new Image();im.onload=()=>{CFG.face=im;buildSkater()};im.src=CFG.faceURL}}}catch(e){}
buildSkater();
let startMap='og';try{startMap=localStorage.getItem('skate3dMap')||'og'}catch(e){}if(!MAPS[startMap])startMap='og';
loadMap(startMap);setUI('title');requestAnimationFrame(loop);
</script></body></html>
